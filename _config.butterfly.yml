favicon: /img/touxiang.jpg

nav:
  logo: /img/touxiang.jpg
  display_title: true
  fixed: false

code_blocks:
  theme: darker
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

avatar:
  img: /img/touxiang.jpg
  effect: false

disable_top_img: false
default_top_img: /img/1st.jpg
index_img: /img/shufa.jpg
archive_img: /img/1st.jpg
tag_img: /img/1st.jpg
category_img: /img/1st.jpg

index_layout: 3

subtitle:
  enable: true
  effect: true
  loop: true
  source: false
  sub:
    - Living to tell the tale

menu:
  Home: / || fas fa-home
  "article||fas fa-list":
    tags: /tags/ || fas fa-music
    categories: /categories/ || fas fa-video
  link: /link/ || fas fa-link

social:
  fab fa-github: https://github.com/SDU-YangJing || Github || "#24292e"
  fas fa-envelope: mailto:1339012709@qq.com || Email || "#4a7dbe"

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:

index_post_content:
  method: 1
  length: 500

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_edit:
  enable: false

noticeOutdate:
  enable: false

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

share:
  use: sharejs
  sharejs:
    sites: facebook,twitter,wechat,weibo,qq

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

footer:
  owner:
    enable: true
    since: 2025
  custom_text:
  copyright: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/SDU-YangJing
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！这里是一个懒惰的理想主义者。For study and technology blog, plz visit my csdn blog(https://blog.csdn.net/qq_66878808?spm=1000.2115.3001.5343)
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: "繁"
  msgToSimplifiedChinese: "簡"

readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: false
  start:
  end:

rightside_scroll_percent: false

lazyload:
  enable: true
  field: site
  placeholder:
  blur: false

pjax:
  enable: true
  exclude:

aplayerInject:
  enable: true
  per_page: true

fireworks:
  enable: true
  zIndex: 9999
  mobile: false

inject:
  head:
    - '<div class="aplayer no-destroy" data-id="2331639478" data-server="netease" data-type="playlist" data-fixed="true" data-mini="true" data-listFolded="false" data-order="random" data-lrctype="1" data-preload="none" data-autoplay="false" muted></div>'
  bottom:

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: false
  custom_format:
  option:
    # The original endpoint currently returns 502 and also causes HTTPS mixed
    # content. This compatible HTTPS endpoint preserves the same counter API.
    busuanzi: https://events.vercount.one/js
